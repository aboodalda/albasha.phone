<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>لوحة تحكم الباشا فون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--card:#fff;--ink:#0b1533;--mut:#64708a;--line:#e3e8f2;--blue:#1f3fbf;--or:#ff6a13;--ok:#16a34a;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#070d1d;--card:#0e1834;--ink:#eef2ff;--mut:#95a3c2;--line:#1b2848}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit;color:inherit}
#lg{min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:380px;display:grid;gap:10px}.box h1{font-size:22px}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.bt{background:var(--or);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.bt.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.bt.r{background:#e11d48}
#ap{display:none;padding-bottom:30px}.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0b1533;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 14px}.tb b{flex:1}.tb button{background:#ffffff1f;color:#fff;border:0;border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:700}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;padding:12px;font-weight:800;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer}.tabs .on{color:var(--or);border-color:var(--or)}
main{max-width:900px;margin:auto;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{flex:1;min-width:140px}.bar select{width:auto}
.r{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}.r img,.r .th{width:48px;height:60px;border-radius:9px;object-fit:contain;background:var(--bg);flex:none;display:grid;place-items:center;font-size:24px}
.in{flex:1;min-width:0}.in b{display:block;font-size:14.5px}.in small{color:var(--mut)}.pr{width:84px!important;padding:4px 8px;margin-top:3px;font-weight:800}
.sw{width:44px;height:25px;border-radius:99px;background:#cbd5e1;position:relative;border:0;flex:none;cursor:pointer}.sw:after{content:"";position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on:after{right:22px}
.ib{background:none;border:0;font-size:18px;cursor:pointer}
.md{display:none;position:fixed;inset:0;background:#050b22b3;z-index:50;align-items:flex-end;justify-content:center}.md.on{display:flex}.md>div{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:grid;gap:9px}
label{display:grid;gap:3px;font-weight:700;font-size:13px}.up{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--mut);cursor:pointer}.up img{max-height:120px;margin:auto;display:block;border-radius:8px}
.o{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:grid;gap:4px;font-size:14px}.o .h{display:flex;justify-content:space-between;gap:8px;align-items:center}.o select{width:auto;padding:4px 8px}.o a{color:var(--ok);font-weight:800}
#msg{color:#e11d48;font-weight:700;font-size:13px;min-height:4px}
body{padding-bottom:78px}.nb{position:fixed;bottom:0;right:0;left:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.nb button{flex:1;background:none;border:0;font:700 11px Cairo;color:var(--mut);display:grid;justify-items:center;cursor:pointer;position:relative}.nb span{font-size:20px}.nb .on{color:var(--or)}.nb i{position:absolute;top:-2px;left:22%;background:#e11d48;color:#fff;font-style:normal;border-radius:99px;padding:0 6px;font-size:10px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.sc small{color:var(--mut);font-weight:600}.sc b{display:block;font-size:26px;font-weight:900}.sc.a{background:linear-gradient(120deg,#0a1650,#1f3fbf);color:#fff;grid-column:1/-1}.sc.a small{color:#c7d2f5}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.cd h3{font-size:15px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:24px 0}.bars span{flex:1;background:linear-gradient(180deg,#ff6a13,#ffb27a);border-radius:6px 6px 0 0;position:relative}.bars em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font:600 11px Cairo;color:var(--mut)}.bars u{position:absolute;top:-18px;left:0;right:0;text-align:center;font:800 11px Cairo;text-decoration:none}
.od{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.od:last-child{border:0}.od small{display:block;color:var(--mut)}.pill{background:#ffedd5;color:#c2410c;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:800}
.br2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.fm{display:grid;gap:9px}
@media(min-width:800px){.st{grid-template-columns:repeat(5,1fr)}.sc.a{grid-column:auto}}
</style></head><body>
<div id="lg"><div class="box"><h1>🔐 لوحة تحكم الباشا فون</h1><input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><div id="lge" style="color:#e11d48;font-weight:700"></div><button class="bt" id="lgb">دخول</button></div></div>
<div id="ap"><div class="tb"><b>لوحة التحكم — الباشا فون</b><button id="out">خروج</button></div>
<main><div id="pv"><div class="bar"><input id="s" placeholder="ابحث…"><select id="ft"><option value="all">الكل</option><option value="new">جديدة</option><option value="used">مستعملة</option><option value="acc">إكسسوارات</option></select><button class="bt" id="add">＋ إضافة</button></div><div id="list"></div>
<div class="bar" style="margin-top:14px"><button class="bt g" id="seed">تحميل المنتجات التجريبية</button><button class="bt g" id="deldemo">🗑️ حذف التجريبية</button></div></div>
<div id="ov" style="display:none"></div><div id="hv"></div><div id="rv" style="display:none"></div><div id="bv" style="display:none"></div></main></div>
<div class="md" id="md"><div><b id="mt">منتج جديد</b>
<label>القسم<select id="ty"><option value="new">جوال جديد</option><option value="used">جوال مستعمل</option><option value="acc">إكسسوار</option></select></label>
<label><span id="bl">الماركة</span><input id="br" list="dl"></label><datalist id="dl"></datalist>
<label>الاسم<input id="nm"></label><label>السعر ₪<input id="pc" type="number" inputmode="numeric"></label><label>السعر قبل الخصم (اختياري)<input id="od" type="number" inputmode="numeric"></label>
<label id="gb">الشارة (جديد / عرض…)<input id="bd"></label><label id="gc">حالة الجهاز<input id="cd" placeholder="ممتاز · بطارية 89%"></label><label id="gt">مدة التشغيل التقريبية<input id="tm" placeholder="تعمل ≈ 18 ساعة"></label><label>المواصفات<textarea id="sp" rows="2"></textarea></label>
<label>صورة المنتج (بتنضغط وترفع تلقائيًا)<div class="up" id="upb">📷 اضغط لاختيار صورة<input id="fi" type="file" accept="image/*" hidden></div></label>
<div id="msg"></div><button class="bt" id="sv">حفظ</button><button class="bt g" id="cx">إلغاء</button></div></div>
<nav class="nb"><button data-t="h"><span>📊</span>الرئيسية</button><button data-t="p"><span>📱</span>المنتجات</button><button data-t="o"><span>🧾</span>الطلبات<i id="oc"></i></button><button data-t="r"><span>🔧</span>الصيانة</button><button data-t="b"><span>📍</span>الفروع</button></nav>
<script type="module" src="admin.js"></script></body></html>
